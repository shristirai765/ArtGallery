<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monet’s Palette · Art Gallery</title>
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Separate CSS file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <!-- Header -->
  <header class="header">
    <h1><i class="fas fa-palette"></i> Monet’s Atelier</h1>
    <div style="display: flex; gap: 0.8rem; flex-wrap: wrap; align-items: center;">
      <span id="userDisplay" style="font-weight: 600; color: var(--monet-deep); background: rgba(255,255,255,0.5); padding: 0.3rem 1rem; border-radius: 40px; display: none;"></span>
      <a href="index.html" class="artist-cta" style="text-decoration: none; background: var(--monet-warm); color: var(--monet-deep);">
        <i class="fas fa-home"></i> Home
      </a>
      <button id="loginBtn" class="artist-cta" style="background: var(--monet-gold); color: var(--monet-deep);">
        <i class="fas fa-sign-in-alt"></i> Login
      </button>
      <button id="logoutBtn" class="artist-cta" style="background: #8b6b5a; color: white; display: none;">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>
  </header>

  <!-- Login Modal -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-modal">
      <div class="login-header">
        <span><i class="fas fa-palette"></i> Sign in</span>
        <button class="login-close" id="loginClose">&times;</button>
      </div>
      <form id="loginForm">
        <div class="login-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="user@example.com" required>
        </div>
        <div class="login-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <div class="login-group">
          <label>Role</label>
          <select id="loginRole">
            <option value="customer">Customer</option>
            <option value="artist">Artist</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <button type="submit" class="login-submit"><i class="fas fa-sign-in-alt"></i> Sign in</button>
        <div style="margin-top: 0.5rem; font-size: 0.8rem; color: #6b7f88; text-align: center;">
          Demo: any email/password works
        </div>
      </form>
    </div>
  </div>

  <!-- Filter Bar -->
  <div class="filter-bar">
    <div class="filter-group">
      <label><i class="fas fa-paint-brush"></i> Medium</label>
      <select id="filterMedium">
        <option value="all">All</option>
        <option value="acrylic">Acrylic</option>
        <option value="oil">Oil</option>
        <option value="watercolor">Watercolor</option>
        <option value="pastel">Pastel</option>
      </select>
    </div>
    <div class="filter-group">
      <label><i class="fas fa-vector-square"></i> Genre</label>
      <select id="filterGenre">
        <option value="all">All</option>
        <option value="impressionism">Impressionism</option>
        <option value="abstract">Abstract</option>
        <option value="realism">Realism</option>
        <option value="surrealism">Surrealism</option>
      </select>
    </div>
    <button class="reset-btn" id="resetFilters"><i class="fas fa-undo-alt"></i> Reset</button>
  </div>

  <!-- Add Painting Panel (visible only to artists & admins) -->
  <div class="add-panel" id="addPanel">
    <h2><i class="fas fa-edit" style="color: var(--monet-gold);"></i> Add your masterpiece</h2>
    <form id="artForm" class="form-grid">
      <div class="form-group">
        <label>Title *</label>
        <input type="text" id="artTitle" placeholder="e.g. Water Lilies" required>
      </div>
      <div class="form-group">
        <label>Artist *</label>
        <input type="text" id="artArtist" placeholder="Claude Monet" required>
      </div>
      <div class="form-group">
        <label>Medium</label>
        <select id="artMedium">
          <option value="acrylic">Acrylic</option>
          <option value="oil" selected>Oil</option>
          <option value="watercolor">Watercolor</option>
          <option value="pastel">Pastel</option>
        </select>
      </div>
      <div class="form-group">
        <label>Genre</label>
        <select id="artGenre">
          <option value="impressionism">Impressionism</option>
          <option value="abstract">Abstract</option>
          <option value="realism">Realism</option>
          <option value="surrealism">Surrealism</option>
        </select>
      </div>
      <div class="form-group">
        <label>Price ($)</label>
        <input type="number" id="artPrice" placeholder="450" min="0" step="1">
      </div>
      <div class="form-group" style="grid-column: span 1; display: flex; align-items: center;">
        <button type="submit" class="submit-art"><i class="fas fa-save"></i> Add painting</button>
      </div>
    </form>
  </div>

  <!-- Gallery Grid -->
  <div class="gallery" id="galleryContainer"></div>

  <div class="footer"><i class="fas fa-seedling"></i> inspired by Monet · art & conversation</div>
</div>

<!-- Chat Modal -->
<div class="chat-overlay" id="chatOverlay">
  <div class="chat-modal">
    <div class="chat-header">
      <span id="chatArtistName">Artist</span>
      <button class="chat-close" id="chatClose">&times;</button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="chat-message system">Welcome! Ask about the artwork or make an offer.</div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="Type a message..." />
      <button id="chatSend"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<!-- Separate JS file -->
<script src="script.js"></script>
</body>
</html>
